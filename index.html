<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snapycut - 2.8M+ Views Generated | Short Form Video Experts</title>

  <!-- ═══ PERFORMANCE: Preconnect to external origins (eliminates DNS lookup latency) ═══ -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://res.cloudinary.com" />

  <!-- ═══ LCP: preload the hero image so the largest content is available early ═══ -->
  <link
    rel="preload"
    as="image"
    href="/assets/hero/hero-bg-image-1.png"
    fetchpriority="high"
    imagesrcset="/assets/hero/hero-bg-image-1-opt.jpg 1x"
  />

  <!-- ═══ FONTS: lightweight and non-blocking — only load the primary brand font ═══ -->
  <link
    rel="preload"
    as="style"
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
  />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
    media="print"
    onload="this.media='all'"
  />
  <!-- Fallback for no-JS -->
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </noscript>



  <!-- ═══ DNS PREFETCH: Warm up connections before they're needed ═══ -->
  <link rel="dns-prefetch" href="https://www.youtube.com" />
  <link rel="dns-prefetch" href="https://i.ytimg.com" />
  <link rel="dns-prefetch" href="https://images.unsplash.com" />
</head>
  <!-- Meta Pixel Code (deferred until user interaction or idle) -->
  <script>
  (function(){
    let loaded = false;
    function loadPixel(){
      if (loaded) return; loaded = true;
      const script = document.createElement('script');
      script.async = true;
      script.src = 'https://connect.facebook.net/en_US/fbevents.js';
      script.onload = () => {
        try {
          if (window.fbq) {
            window.fbq('init', '1057589916702507');
            window.fbq('track', 'PageView');
          }
        } catch(e) { /* ignore */ }
      };
      document.head.appendChild(script);
    }

    // Trigger load on first user interaction or when browser is idle
    const onInteraction = () => { loadPixel(); removeListeners(); };
    const removeListeners = () => {
      ['pointerdown','keydown','scroll','touchstart'].forEach(ev => window.removeEventListener(ev, onInteraction, { passive: true }));
      document.removeEventListener('visibilitychange', onVisibility);
    };
    const onVisibility = () => { if (document.visibilityState === 'hidden') loadPixel(); };

    ['pointerdown','keydown','scroll','touchstart'].forEach(ev => window.addEventListener(ev, onInteraction, { passive: true }));
    document.addEventListener('visibilitychange', onVisibility);

    if ('requestIdleCallback' in window) {
      window.requestIdleCallback(() => { if (!loaded) loadPixel(); }, { timeout: 3000 });
    } else {
      // Fallback: load after a short delay if no interaction
      setTimeout(() => { if (!loaded) loadPixel(); }, 4500);
    }
  })();
  </script>
  <!-- End Meta Pixel Code -->

<body>
  <noscript><img height="1" width="1" style="display:none"
  src="https://www.facebook.com/tr?id=1057589916702507&ev=PageView&noscript=1"
  /></noscript>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
