<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snapycut - 2.8M+ Views Generated | Short Form Video Experts</title>

  <!-- ═══ PERFORMANCE: Preconnect to external origins (eliminates DNS lookup latency) ═══ -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://res.cloudinary.com" />

  <!-- ═══ FONTS: Non-blocking — loaded in parallel, won't block render ═══ -->
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
    media="print"
    onload="this.media='all'"
  />
  <!-- Fallback for no-JS -->
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </noscript>



  <!-- ═══ DNS PREFETCH: Warm up connections before they're needed ═══ -->
  <link rel="dns-prefetch" href="https://www.youtube.com" />
  <link rel="dns-prefetch" href="https://i.ytimg.com" />
  <link rel="dns-prefetch" href="https://images.unsplash.com" />
</head>
  <!-- Meta Pixel Code -->
  <script defer>
  window.addEventListener('load', () => {
    const script = document.createElement('script');
    script.async = true;
    script.src = 'https://connect.facebook.net/en_US/fbevents.js';
    script.onload = () => {
      if (window.fbq) {
        window.fbq('init', '1057589916702507');
        window.fbq('track', 'PageView');
      }
    };
    document.head.appendChild(script);
  });
  </script>
  <!-- End Meta Pixel Code -->

<body>
  <noscript><img height="1" width="1" style="display:none"
  src="https://www.facebook.com/tr?id=1057589916702507&ev=PageView&noscript=1"
  /></noscript>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
